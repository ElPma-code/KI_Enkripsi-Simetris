<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nestiefy - Sign In</title>

  <!-- Font dari design.md: Bodoni Moda (judul) & Montserrat (teks) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS (CDN, tanpa build) -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- Warna & font dari design.md (sama dengan index.html) -->
  <style type="text/tailwindcss">
    @theme {
      --color-cream: #F7F3EA;
      --color-primary: #005653;
      --color-gold: #B39957;
      --color-sage: #97B8BD;
      --color-muted: #556D79;
      --color-ink: #333F4D;
      --font-heading: "Bodoni Moda", serif;
      --font-body: "Montserrat", sans-serif;
    }
  </style>
</head>
<body class="bg-cream font-body font-medium text-ink antialiased">

  <div class="flex min-h-screen">

    <!-- ==================== KIRI: GAMBAR (placeholder) ==================== -->
    <!-- Disembunyikan di layar kecil, muncul mulai ukuran laptop (lg) -->
    <div class="relative hidden overflow-hidden bg-primary lg:block lg:w-3/5">

      <!-- Ganti placeholder di bawah dengan gambar asli, contoh:
           <img src="assets/login.jpg" alt="" class="absolute inset-0 h-full w-full object-cover"> -->

      <!-- Placeholder: gradasi hijau + garis cahaya miring -->
      <div class="absolute inset-0 bg-gradient-to-br from-primary via-primary to-ink"></div>
      <div class="absolute -left-1/4 -top-1/4 h-[150%] w-1/3 rotate-12 bg-white/5"></div>
      <div class="absolute left-1/4 -top-1/4 h-[150%] w-1/6 rotate-12 bg-white/5"></div>

      <div class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-sage/70">
        <svg class="h-12 w-12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/>
        </svg>
        <p class="text-xs uppercase tracking-[0.3em]">Image Placeholder</p>
      </div>
    </div>

    <!-- ==================== KANAN: FORM LOGIN ==================== -->
    <main class="flex w-full items-center justify-center px-6 py-12 lg:w-2/5">
      <div class="w-full max-w-sm">

        <!-- Logo -->
        <div class="text-center">
          <a href="index.html" class="font-heading text-5xl font-bold text-primary">Nestiefy</a>
          <p class="mt-3 text-xs uppercase tracking-[0.3em] text-muted">Welcome Back</p>
        </div>

        <!-- Form -->
        <form id="loginForm" class="mt-10 space-y-4">

          <!-- Email -->
          <label class="relative block">
            <span class="sr-only">Email address</span>
            <svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" name="email" required placeholder="Email address" autocomplete="email"
              class="w-full rounded-md border border-ink/20 bg-white/60 py-3 pl-12 pr-4 text-sm placeholder:text-muted/70 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </label>

          <!-- Password -->
          <label class="relative block">
            <span class="sr-only">Password</span>
            <svg class="pointer-events-none absolute left-4 top-1/2 h-5 w-5 -translate-y-1/2 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" name="password" required placeholder="Password" autocomplete="current-password"
              class="w-full rounded-md border border-ink/20 bg-white/60 py-3 pl-12 pr-4 text-sm placeholder:text-muted/70 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20">
          </label>

          <!-- Tombol Sign In -->
          <button type="submit" class="w-full rounded-md bg-primary py-3 text-sm text-white transition-colors hover:bg-primary/90">
            Sign In
          </button>

          <p class="text-center">
            <a href="#" class="text-xs text-primary underline underline-offset-4 hover:text-gold">Forgot password?</a>
          </p>
        </form>

        <!-- Pemisah -->
        <div class="my-8 flex items-center gap-4">
          <span class="h-px flex-1 bg-ink/15"></span>
          <span class="text-xs text-muted">or continue with</span>
          <span class="h-px flex-1 bg-ink/15"></span>
        </div>

        <!-- Login pihak ketiga (tampilan saja) -->
        <div class="space-y-3">
          <button type="button" class="flex w-full items-center justify-center gap-3 rounded-md border border-ink/20 bg-white/60 py-3 text-sm transition-colors hover:border-primary">
            <!-- Logo Google -->
            <svg class="h-5 w-5" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.06H2.18A11 11 0 0 0 1 12c0 1.78.43 3.45 1.18 4.94l3.66-2.84z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            Sign in with Google
          </button>

          <button type="button" class="flex w-full items-center justify-center gap-3 rounded-md border border-ink/20 bg-white/60 py-3 text-sm transition-colors hover:border-primary">
            <!-- Logo Microsoft -->
            <svg class="h-5 w-5" viewBox="0 0 24 24">
              <rect x="1" y="1" width="10" height="10" fill="#F25022"/>
              <rect x="13" y="1" width="10" height="10" fill="#7FBA00"/>
              <rect x="1" y="13" width="10" height="10" fill="#00A4EF"/>
              <rect x="13" y="13" width="10" height="10" fill="#FFB900"/>
            </svg>
            Sign in with Microsoft
          </button>
        </div>

        <!-- Daftar akun -->
        <p class="mt-8 text-center text-xs text-muted">
          Don't have an account?
          <a href="#" class="ml-1 text-primary underline underline-offset-4 hover:text-gold">Create one</a>
        </p>

      </div>
    </main>

  </div>

  <script>
    // Sementara langsung ke dashboard dulu, nanti kalau emailnya bukan email admin baru ke landing page
    document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = 'dashboard.html';
    });
  </script>

</body>
</html>
