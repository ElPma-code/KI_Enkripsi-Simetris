<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nestiefy - Error {{ code }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-cream: #F7F3EA;
      --color-primary: #133933;
      --color-primary-hover: #1F4B42;
      --color-gold: #C9A45C;
      --color-muted: #7D847F;
      --color-ink: #1F2A24;
      --font-heading: "Bodoni Moda", serif;
      --font-body: "Montserrat", sans-serif;
    }
  </style>
</head>
<body class="bg-cream font-body font-medium text-ink antialiased min-h-screen flex items-center justify-center px-6">

  <div class="max-w-md w-full text-center">
    <h1 class="font-heading text-7xl font-bold text-primary">{{ code }}</h1>
    <h2 class="mt-4 font-heading text-3xl font-bold text-ink">{{ title }}</h2>
    <p class="mt-4 text-sm text-muted leading-relaxed">{{ message }}</p>

    <a href="{{ url_for('dashboard') }}"
       class="inline-block mt-8 rounded-md bg-primary px-6 py-3 text-sm text-white hover:bg-primary-hover transition-colors">
      Kembali ke Dashboard
    </a>
    <a href="{{ url_for('home') }}"
       class="block mt-3 text-xs text-muted hover:text-primary underline underline-offset-4">
      Halaman Utama
    </a>
  </div>

</body>
</html>
